<div class="chat-shell">
  <app-chat-sidebar
    [chats]="chats()"
    [activeChatId]="activeChatId()"
    [loading]="chatsLoading()"
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    (newChat)="startNewChat()"
    (selectChat)="openChat($event)"
    (renameChat)="renameChat($event)"
    (deleteChat)="deleteChat($event)"
    (toggleCollapsed)="toggleSidebar()"
    (closeMobile)="closeMobileSidebar()"
  />

  <section class="chat-shell__conversation">
    <button
      type="button"
      class="chat-shell__mobile-toggle"
      aria-label="Open chat list"
      (click)="toggleMobileSidebar()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 6h16M4 12h16M4 18h16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>

    @if (error()) {
      <p class="chat-shell__error" role="alert">{{ error() }}</p>
    }

    <app-message-list
      [messages]="messages()"
      [pending]="pending()"
      [progressLabel]="progressLabel()"
    />

    <app-message-composer [disabled]="pending()" (submitted)="submitQuery($event)" />
  </section>
</div>
