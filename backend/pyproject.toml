[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comptarag-backend"
version = "0.1.0"
description = "FastAPI backend for the ComptaRAG agentic RAG assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.38,<0.39",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "ollama>=0.6,<0.7",
    "google-genai>=1.52,<2",
    "chromadb>=1.3,<2",
    "langgraph>=1.0,<2",
    "tavily-python>=0.7,<0.8",
    "pypdf>=6.3,<7",
    "firebase-admin>=7.5,<8",
    "requests>=2.32,<3",
]

# This package ships no importable code of its own, config/graph/routes/services
# are imported directly (as they already are at runtime via "uvicorn main:app"
# run from inside backend/), pyproject.toml here only pins dependencies and
# centralizes tool config.
[tool.setuptools]
packages = []

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<1",
]
dev = [
    "comptarag-backend[test]",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export names as a package's public surface on purpose.
"__init__.py" = ["F401"]
# mock_modules is imported purely for its side effect (stubbing third-party
# packages into sys.modules before any production module can import the
# real ones); it is never referenced by name.
"tests/conftest.py" = ["F401"]
# `assert False, "..."` in a try/except is a common, harmless idiom for
# "this line should be unreachable" and reads clearer than raising manually.
"tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on calling Depends(...) (and
# our own require_roles(...) factory) directly in argument defaults, this is
# the documented, intended usage, not the mutable-default-argument bug B008
# otherwise warns about.
extend-immutable-calls = ["fastapi.Depends", "core.security.require_roles"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "."
exclude = ["tests/","assets/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true